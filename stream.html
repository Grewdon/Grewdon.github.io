  <style>
    :root {
      --bg-base: #0B0E14;
      --bg-surface: rgba(18, 24, 38, 0.75);
      --bg-card: rgba(26, 34, 52, 0.55);
      --bg-card-hover: rgba(36, 48, 74, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(0, 242, 254, 0.4);

      --accent-glow: rgba(0, 242, 254, 0.35);

      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
      --radius-lg: 20px;
      --radius-md: 14px;
      --transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2.5rem 1rem 2.5rem 280px; /* Offset for permanent sidebar on desktop */
      position: relative;
      overflow-x: hidden;
      line-height: 1.5;
    }

    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;

    .bg-gradient-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;

      z-index: 0;
    }

    /* Navigation Sidebar */
    .menu-trigger {

      position: fixed;
      top: 1.25rem;
      left: 1.25rem;
      z-index: 100;
      background: rgba(20, 26, 40, 0.8);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: var(--transition);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .menu-trigger:hover {
      border-color: var(--accent-primary);
      transform: scale(1.05);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 110;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .sidebar-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 260px;
      height: 100%;
      background: rgba(15, 20, 32, 0.95);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--border-color);
      z-index: 120;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      box-shadow: 10px 0 30px rgba(0,0,0,0.5);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
    }

    .sidebar-header h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.2rem;
    }

    .close-btn {
      display: none; /* Hidden on desktop */
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .nav-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.8rem 1rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: var(--transition);
      text-decoration: none;
    }

    .nav-item:hover, .nav-item.active {
      background: var(--bg-card-hover);
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    .container {
      width: 100%;
      max-width: 680px;
      z-index: 10;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .twitch-embed-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    }

    .embed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .embed-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #FFF;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .embed-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .embed-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    footer {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2rem;
    }

    footer a {
      color: var(--accent-primary);
      text-decoration: none;
    }

    @media (max-width: 900px) {
      body {
        padding: 2.5rem 1rem !important;
      }
      .menu-trigger {
        display: flex;
      }
      .close-btn {
        display: block;
      }
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
    }
  </style>
</head>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Mobile Sidebar Toggles
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    
    function toggleSidebar(open) {
      if (open) {
        sidebar.classList.add('open');
        sidebarOverlay.classList.add('open');
      } else {
        sidebar.classList.remove('open');
        sidebarOverlay.classList.remove('open');
      }
    }

    document.getElementById('openSidebar').addEventListener('click', () => toggleSidebar(true));
    document.getElementById('closeSidebar').addEventListener('click', () => toggleSidebar(false));
    sidebarOverlay.addEventListener('click', () => toggleSidebar(false));

    // Interactive Canvas Particles
    const canvas = document.getElementById('particles-canvas');
    if (canvas) {
      const ctx = canvas.getContext('2d');

      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particles = [];
      const particleCount = Math.min(Math.floor(width / 25), 45);

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5,
          size: Math.random() * 2 + 1,
          alpha: Math.random() * 0.5 + 0.2
        });
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);

        const computedStyle = getComputedStyle(document.body);
        const accentColor = computedStyle.getPropertyValue('--accent-primary').trim() || '#00F2FE';

        for (let i = 0; i < particles.length; i++) {
          let p = particles[i];
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 0) p.x = width;
          if (p.x > width) p.x = 0;
          if (p.y < 0) p.y = height;
          if (p.y > height) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = accentColor;
          ctx.globalAlpha = p.alpha;
          ctx.fill();

          for (let j = i + 1; j < particles.length; j++) {
            let p2 = particles[j];
            let dx = p.x - p2.x;
            let dy = p.y - p2.y;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 120) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = accentColor;
              ctx.globalAlpha = (1 - dist / 120) * 0.15;
              ctx.stroke();
            }
          }
        }

        requestAnimationFrame(animate);
      }

      animate();
    }
  </script>
